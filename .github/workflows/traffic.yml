name: traffic

# GitHub хранит статистику трафика только 14 дней. Снимаем её раз в сутки
# и дописываем в docs/traffic.csv, чтобы история не терялась.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать статистику
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/traffic.py "$GITHUB_REPOSITORY" docs/traffic.csv

      - name: Зафиксировать, если что-то изменилось
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/traffic.csv
          git diff --staged --quiet && echo "изменений нет" && exit 0
          git commit -m "traffic: снимок за $(date -u +%F)"
          git push
